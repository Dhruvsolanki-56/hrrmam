# Frontend only. Set VITE_API_URL in Netlify (Site settings > Environment variables)
# to the public URL of the FastAPI backend, e.g. https://neohealth-api.onrender.com
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
